name: Publicar el almanaque
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar exclusivamente la edición pública
        run: |
          while IFS= read -r file || [ -n "$file" ]; do
            install -D -m 644 "public/$file" "sitio/$file"
          done < scripts/public-files.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
